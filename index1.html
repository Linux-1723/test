<!DOCTYPE html>
<html>
<body>
    <button onclick="trigger()">Trigger Iframe Crash</button>
    <div id="container"></div>

    <script>
        function trigger() {
            let container = document.getElementById('container');
            
            // Create an iframe that will alert immediately
            let ifr = document.createElement('iframe');
            ifr.srcdoc = "<script>setTimeout(() => { alert('Iframe Alert'); }, 500);<\/script>";
            container.appendChild(ifr);

            // Destroy the iframe while the alert is trying to render
            setTimeout(() => {
                container.innerHTML = ''; 
                // Alternatively, try window.location.href = 'https://google.com' here
            }, 550);
        }
    </script>
</body>
</html>
