<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 18px;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1b1b1b;
    background:
        radial-gradient(ellipse at 14% 85%, rgba(198,222,246,.52), transparent 35%),
        radial-gradient(ellipse at 82% 72%, rgba(250,229,241,.46), transparent 38%),
        linear-gradient(115deg, #eef3fa, #f7f7fb 52%, #f5f4fa);
    overflow-x: hidden;
}

body::before,
body::after {
    content: "";
    position: fixed;
    pointer-events: none;
    border: 1px solid rgba(174,204,237,.35);
    transform: rotate(-13deg);
    border-radius: 24px;
}

body::before {
    width: 950px;
    height: 470px;
    left: -180px;
    bottom: -280px;
}

body::after {
    width: 1000px;
    height: 520px;
    right: -430px;
    top: 100px;
    transform: rotate(-10deg);
}

.page {
    width: 562px;
    max-width: 100%;
    position: relative;
    z-index: 1;
}

.card {
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.22);
    padding: 56px;
}

.brand-space {
    height: 32px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    color: #666;
    font-size: 24px;
    font-weight: 600;
}

h1 {
    font-size: 30px;
    line-height: 36px;
    margin: 0;
    font-weight: 600;
}

.subtitle {
    font-size: 16px;
    margin: 0 0 27px;
}

.field {
    width: 100%;
    border: none;
    border-bottom: 1px solid #666;
    border-radius: 0;
    padding: 3px 0 10px;
    font: 20px "Segoe UI", Arial, sans-serif;
    color: #1b1b1b;
    outline: none;
    background: transparent;
}

.field::placeholder {
    color: #666;
}

.field:focus {
    border-bottom: 2px solid #0067b8;
}

.account,
.access {
    font-size: 16px;
    margin-top: 23px;
}

.access {
    margin-top: 25px;
}

a {
    color: #0067c0;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 33px;
}

.next {
    width: 138px;
    height: 41px;
    border: none;
    background: #0067b8;
    color: white;
    font: 20px "Segoe UI", Arial, sans-serif;
    cursor: pointer;
}

.next:hover {
    background: #005da6;
}

.options {
    margin-top: 26px;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.22);
}

.option {
    min-height: 61px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 13px 62px;
    font-size: 20px;
}

.option svg {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
}

.demo-note {
    text-align: center;
    color: #555;
    font-size: 12px;
    margin-top: 18px;
}

@media (max-width: 620px) {
    body {
        align-items: flex-start;
        padding-top: 42px;
    }

    .card {
        padding: 36px 28px;
    }

    .option {
        padding: 13px 28px;
    }
}
</style>
</head>

<body>

<main class="page">

    <!-- Login Card -->
    <section class="card">

        <div class="brand-space">Pixel perfect misrosoft login page!</div>

        <h1>Sign in</h1>

        <p class="subtitle">
            to continue to your account
        </p>

        <form id="demoForm">

            <input
                class="field"
                type="text"
                autocomplete="off"
                placeholder="Email, phone, or username"
                aria-label="Email, phone, or username"
            >

            <p class="account">
                No account?
                <a href="#" onclick="return false">Create one!</a>
            </p>

            <p class="access">
                <a href="#" onclick="return false">
                    Can’t access your account?
                </a>
            </p>

            <div class="actions">
                <button class="next" type="button" id="nextButton">
                    Next
                </button>
            </div>

        </form>
    </section>

    <!-- Sign-in Options -->
    <section class="options">

        <div class="option">

            <!-- Key Icon -->
            <svg viewBox="0 0 32 32"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <circle cx="11" cy="11" r="8.5"></circle>

                <path d="M17 17 29 29v-6h-5v-5h-5"></path>

                <circle cx="11" cy="11" r="2"
                        fill="currentColor"
                        stroke="none"></circle>
            </svg>

            <span>Sign-in options</span>

        </div>

        <div class="option">

            <!-- GitHub Icon -->
            <svg viewBox="0 0 24 24" fill="currentColor">

                <path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 1.72 2.63 1.22 3.27.93.1-.72.39-1.22.71-1.5-2.48-.28-5.09-1.24-5.09-5.53 0-1.22.44-2.21 1.16-2.99-.12-.28-.5-1.42.11-2.95 0 0 .95-.3 3.08 1.14a10.7 10.7 0 0 1 5.61 0c2.13-1.44 3.08-1.14 3.08-1.14.61 1.53.23 2.67.11 2.95.72.78 1.16 1.77 1.16 2.99 0 4.3-2.62 5.24-5.11 5.52.4.35.76 1.03.76 2.08v3.07c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z"/>

            </svg>

            <span>Sign in with GitHub</span>

        </div>

    </section>

    <p class="demo-note">
        pwned! 1337
    </p>

</main>

<script>
document.getElementById("nextButton").addEventListener("click", () => {
    alert("This is a static demo. No sign-in request was sent.");
});

document.getElementById("demoForm").addEventListener("submit", event => {
    event.preventDefault();
});
</script>

</body>
</html>
