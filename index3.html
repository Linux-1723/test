<!DOCTYPE html>
<html>
<body>
    <button onclick="start()">Trigger Focus Crash</button>
    <script>
        function start() {
            // Open a background tab
            let bgTab = window.open('about:blank', '_blank');
            
            setTimeout(() => {
                // Try to force the browser to switch back to this tab
                window.focus(); 
                
                // Immediately throw an alert in the background tab
                bgTab.alert("Are you crashing?");
            }, 1000);
        }
    </script>
</body>
</html>
